<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你的staff人格</title>
<style>
/* ===== 配色：背景 #FFF5F8 主色 #FFB6C1 辅助 #E6C8E8 文字 #332830 ===== */
:root{--bg:#FFF5F8;--main:#FFB6C1;--sub:#E6C8E8;--ink:#332830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);
 font-family:"Yuanti SC","YouYuan","Varela Round","Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:7vh 20px 8vh;min-height:100vh}

/* ===== CSS绘制的装饰：半透明爱心与星星，不拦截点击 ===== */
.deco{position:fixed;z-index:0;pointer-events:none;opacity:.3;background:var(--main)}
.star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.heart{background:none}
.heart i{position:absolute;inset:0;background:var(--main);transform:rotate(-45deg)}
.heart i::before,.heart i::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;background:var(--main)}
.heart i::before{top:-50%;left:0}.heart i::after{left:50%;top:0}
.d1{width:46px;height:46px;top:3%;left:6%;background:var(--sub)}
.d2{width:26px;height:26px;top:8%;right:9%;transform:rotate(12deg)}
.d3{width:36px;height:36px;bottom:12%;left:8%;background:var(--sub)}
.d4{width:22px;height:22px;bottom:6%;right:10%}
.d5{width:30px;height:30px;top:46%;right:3%;background:var(--sub)}

/* ===== 通用组件 ===== */
.page{animation:slideIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,9vw,48px);line-height:1.25;margin:0 0 18px;color:var(--main);text-shadow:0 3px 0 var(--sub);text-align:center}
.intro{text-align:center;font-size:19px;line-height:1.8;margin:0 0 36px}
.btn{font:inherit;color:var(--ink);cursor:pointer;border-radius:28px;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:scale(1.04);box-shadow:0 8px 20px rgba(255,182,193,.5)}
.btn:active{transform:scale(.98)}
.main-btn{display:block;margin:0 auto;background:var(--main);border:none;font-size:22px;font-weight:700;padding:16px 46px}
.main-btn:hover{background:#ffa7b5}

/* ===== 答题页 ===== */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:700;color:#7a6070}
.bar{flex:1;height:12px;background:#fff;border:2px solid var(--sub);border-radius:12px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--main);border-radius:12px;transition:width .5s}
.q-title{font-size:22px;line-height:1.7;font-weight:700;margin:0 0 24px;background:#fff;border:2px solid var(--sub);border-radius:26px;padding:20px 22px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--sub);font-size:17px;line-height:1.7;padding:15px 20px;margin:0 0 14px}
.opt:hover{border-color:var(--main)}
.opt:active,.opt.on{background:var(--main);border-color:var(--main)}

/* ===== 结果页：文字依次缓缓弹出 ===== */
.res-tag{text-align:center;font-size:17px;color:#7a6070;margin:0 0 6px}
.res-card{background:#fff;border:3px solid var(--sub);border-radius:34px;padding:28px 24px;margin:18px 0 30px}
.pop{opacity:0;animation:pop .9s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.res-card p{font-size:18px;line-height:1.95;margin:0 0 12px}
.res-card p:first-child{font-size:21px;font-weight:700}
.sub-btn{display:block;margin:0 auto;background:#fff;border:2px solid var(--sub);font-size:18px;padding:13px 38px}
.sub-btn:hover{background:var(--sub)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="deco star d1"></div><div class="deco heart d2"><i></i></div>
<div class="deco heart d3" style="background:none"><i style="background:var(--sub)"></i></div>
<div class="deco star d4"></div><div class="deco star d5"></div>
<div id="app"></div>

/* ===================== 结局文案（原文照录） ===================== */
const resultTexts = {

},

},

/* ===================== Web Audio 合成音效（无外部文件） ===================== */
let actx = null;
function ctx() { // 首次点击时创建/唤醒音频环境（浏览器要求用户手势）
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
// 播放一个音：频率、起始偏移、时长、波形、音量
function tone(freq, start, dur, type, vol, slideTo) {
  const a = ctx(); if (!a) return;
  const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function playClick() { tone(880, 0, 0.09, 'sine', 0.18, 1320); }                 // 短促点击
function playPageFlip() {                                                         // 翻页：下滑的轻“唰”
  tone(520, 0, 0.18, 'triangle', 0.1, 220);
  tone(300, 0.06, 0.16, 'sine', 0.07, 160);
}
function playResult() {                                                           // 结算：上行琶音播报
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'sine', 0.16));
  tone(1319, 0.55, 0.6, 'triangle', 0.12);
}

/* ===================== 游戏逻辑 ===================== */
const app = document.getElementById('app');
let scores, cur, locked;

function show(html) { app.innerHTML = '<div class="page">' + html + '</div>'; window.scrollTo(0, 0); }

function startPage() {
  scores = {S:0, H:0, R:0, L:0, F:0}; cur = 0; locked = false;
  show(`<div style="padding-top:12vh"><h1>测测你的staff人格</h1>
    <p class="intro">你再牛能忍住不代入一波？</p>
    <button class="btn main-btn" id="go">开始测试</button></div>`);
  document.getElementById('go').onclick = () => { playClick(); renderQuestion(); };
}

function renderQuestion() {
  const q = questions[cur];
  show(`<div class="progress"><span>${cur + 1} / ${questions.length}</span><div class="bar"><b style="width:${(cur / questions.length) * 100}%"></b></div></div>
    <h2 class="q-title"></h2><div id="opts"></div>`);
  app.querySelector('.q-title').textContent = q.title;
  const box = document.getElementById('opts');
  q.options.forEach(op => {
    const b = document.createElement('button');
    b.className = 'btn opt'; b.textContent = op.text;
    b.onclick = () => choose(op, b);
    box.appendChild(b);
  });
  requestAnimationFrame(() => { const f = app.querySelector('.bar b'); if (f) f.style.width = ((cur + 1) / questions.length) * 100 + '%'; });
}

function choose(op, btn) {
  if (locked) return; locked = true;
  btn.classList.add('on'); playClick();
  for (const k in op.score) scores[k] += op.score[k];        // 累加五维分数
  setTimeout(() => {
    cur++;
    if (cur < questions.length) { playPageFlip(); renderQuestion(); locked = false; }
    else { playPageFlip(); setTimeout(showResult, 250); }
  }, 280);
}

function showResult() {
  const max = Math.max(...Object.values(scores));
  const tops = Object.keys(scores).filter(k => scores[k] === max);
  const key = tops[Math.floor(Math.random() * tops.length)];   // 同分随机取一个
  const r = resultTexts[key];
  show(`<p class="res-tag">你的staff人格是</p><h1></h1><div class="res-card" id="card"></div>
    <button class="btn sub-btn" id="again">重新测试</button>`);
  app.querySelector('h1').textContent = r.title;
  const card = document.getElementById('card');
  r.content.split('\n').forEach((line, i) => {            // 逐行缓缓弹出
    const p = document.createElement('p'); p.className = 'pop'; p.textContent = line;
    p.style.animationDelay = (0.3 + i * 0.7) + 's'; card.appendChild(p);
  });
  playResult();
  document.getElementById('again').onclick = () => { playClick(); startPage(); }; // 重置分数
}

startPage();
</script>
</body>
</html>
